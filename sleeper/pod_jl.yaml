# sleeper J-lens pod: sky launch -c sleeper-jl-<n> pod_jl.yaml ; boot over ssh by dispatch.py
resources:
  cloud: runpod
  accelerators: {L40S:1, A100-80GB:1, A100-80GB-SXM:1, H100:1, H100-SXM:1, H200-SXM:1, RTXPRO6000:1, H100-NVL:1}
  disk_size: 200
envs:
  HF_HOME: /hf
  HF_HUB_ENABLE_HF_TRANSFER: 0
setup: |
  echo provisioned  # real setup in boot.sh over ssh, so the API server frees up right after provisioning
run: |
  echo setup done
