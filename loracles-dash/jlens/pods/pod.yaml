# One J-lens split-means pod per animal: uvx --from 'skypilot[runpod]' sky launch -c jlens-sweep-<animal> --env ANIMAL=<animal> pod.yaml
resources:
  cloud: runpod
  accelerators: {H100-SXM:1, H200-SXM:1, H100:1, A100-80GB:1, RTXPRO6000:1, L40S:1}
  disk_size: 120
envs:
  ANIMAL: owl
  HF_HOME: /hf
  HF_HUB_ENABLE_HF_TRANSFER: 0
  COLLECT_B64: 
  JOB_B64: 
setup: |
  set -euo pipefail
  mkdir -p /hf
  echo "$COLLECT_B64" | base64 -d > ~/collect_split.py
  echo "$JOB_B64" | base64 -d > ~/job.sh
  curl -LsSf https://astral.sh/uv/install.sh | sh
  ~/.local/bin/uv venv -q --python 3.12 ~/venv
  (VIRTUAL_ENV=~/venv ~/.local/bin/uv pip install -q torch --index-url https://download.pytorch.org/whl/cu128 &&
   VIRTUAL_ENV=~/venv ~/.local/bin/uv pip install -q transformers peft datasets safetensors 'huggingface_hub[hf_xet]' accelerate) &
  (sleep 5; until [ -x ~/venv/bin/hf ]; do sleep 5; done; ~/venv/bin/hf download Qwen/Qwen3-14B > /dev/null 2>&1 || true) &
  wait
  ~/venv/bin/hf download Qwen/Qwen3-14B > /dev/null
  ~/venv/bin/python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.get_device_name(0))"
run: |
  bash ~/job.sh $ANIMAL 2>&1 | tee ~/job.log
