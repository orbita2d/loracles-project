# 8-GPU pod for the update J-lens readout: uvx --from 'skypilot[runpod]' sky launch -c jlens-upd-<n> pod8.yaml ; job started over ssh (go.sh)
resources:
  cloud: runpod
  accelerators: {H100-SXM:8, H200-SXM:8, A100-80GB-SXM:8, H100:8, A100-80GB:8, L40S:8}
  disk_size: 400
envs:
  HF_HOME: /hf
  HF_HUB_ENABLE_HF_TRANSFER: 0
setup: |
  set -euo pipefail
  mkdir -p /hf
  curl -LsSf https://astral.sh/uv/install.sh | sh
  ~/.local/bin/uv venv -q --python 3.12 ~/venv
  VIRTUAL_ENV=~/venv ~/.local/bin/uv pip install -q 'huggingface_hub[hf_xet]'
  (~/venv/bin/hf download Qwen/Qwen3-14B > /dev/null 2>&1; ~/venv/bin/hf download neuronpedia/jacobian-lens qwen3-14b/jlens/Salesforce-wikitext/Qwen3-14B_jacobian_lens.pt --local-dir ~/lens > /dev/null 2>&1) &
  VIRTUAL_ENV=~/venv ~/.local/bin/uv pip install -q torch --index-url https://download.pytorch.org/whl/cu128
  VIRTUAL_ENV=~/venv ~/.local/bin/uv pip install -q transformers peft datasets safetensors accelerate
  wait
  ~/venv/bin/hf download Qwen/Qwen3-14B > /dev/null
  ~/venv/bin/python -c "import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.cuda.device_count(), torch.cuda.get_device_name(0))"
run: |
  echo setup done
