# 8-GPU pod for the update J-lens readout: uvx --from 'skypilot[runpod]' sky launch -c jlens-upd-<n> pod8.yaml ; job started over ssh (go.sh)
resources:
  cloud: runpod
  accelerators: {H100-SXM:4, H200-SXM:4, A100-80GB-SXM:4, H100:4, A100-80GB:4, L40S:4, RTXPRO6000:4, H100-NVL:4}
  disk_size: 300
envs:
  HF_HOME: /hf
  HF_HUB_ENABLE_HF_TRANSFER: 0
setup: |
  echo provisioned  # real setup in boot.sh over ssh, so the API server frees up right after provisioning
run: |
  echo setup done
